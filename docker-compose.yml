services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: aip
      POSTGRES_DB: aip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/aip-assets;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      # NOTE: If LITELLM_DEFAULT_PROVIDER=deepseek (the default), you must set
      # DEEPSEEK_API_KEY in your .env file — generation will always fail without it.
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aip:aip@postgres:5432/aip
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET_NAME: aip-assets
      # Local compose is a development environment. In a real production
      # deployment set ENVIRONMENT=production AND a strong SECRET_KEY
      # (e.g. `openssl rand -hex 32`) — the app refuses to boot in
      # production with the built-in default key.
      ENVIRONMENT: development
      SECRET_KEY: local-dev-only-not-secret
      CORS_ORIGINS: "http://localhost:3000"
      # host.docker.internal lets the container reach Ollama running on your Mac
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10
    env_file:
      # NOTE: DEEPSEEK_API_KEY (and any other AI provider keys) must be in .env —
      # the worker runs generation jobs and will fail if the key is missing.
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aip:aip@postgres:5432/aip
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET_NAME: aip-assets
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # BACKEND_URL: server-side URL the Next.js container uses to reach the backend.
      # Uses Docker container DNS — the browser never touches this URL directly.
      BACKEND_URL: http://backend:8000
      # NEXT_PUBLIC_API_URL: baked into the browser bundle at build time.
      # Keep as localhost so direct browser→backend calls also work locally.
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
